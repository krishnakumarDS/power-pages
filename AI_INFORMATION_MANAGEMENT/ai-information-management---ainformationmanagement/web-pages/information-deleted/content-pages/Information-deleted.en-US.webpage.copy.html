<div class="dewa-app-page">
  <div class="dewa-page-header">
    <div>
      <h1>AI Information</h1>
      <p>All submitted AI information records.</p>
    </div>
    <div><a href="/information/new" class="btn btn-dewa-primary">+ Submit New</a></div>
  </div>
  <div class="dewa-table-wrap">
    <table class="dewa-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Status</th>
          <th>Last Updated</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="dewa-info-tbody">
        <tr>
          <td colspan="5" align="center" style="text-align: center; padding: 2rem; color: var(--dewa-text-secondary);">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div id="dewa-panel-backdrop" class="dewa-panel-backdrop"></div>
  <div id="dewa-info-panel" class="dewa-panel" style="width: 480px;">
    <div class="dewa-panel-header">
      <h3 style="margin: 0;">Record Details</h3>
      <button type="button" id="dewa-panel-close" aria-label="Close" style="background: none; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--dewa-text-secondary);">×</button>
    </div>
    <div class="dewa-panel-body">
      <div class="mb-3">
        <label class="dewa-field-label">Title</label>
        <div id="dewa-view-title"></div>
      </div>
      <div class="mb-3">
        <label class="dewa-field-label">Category</label>
        <div id="dewa-view-category"></div>
      </div>
      <div class="mb-3">
        <label class="dewa-field-label">Status</label>
        <div id="dewa-view-status"></div>
      </div>
      <div class="mb-3">
        <label class="dewa-field-label">Description</label>
        <div id="dewa-view-description"></div>
      </div>
    </div>
    <div class="dewa-panel-footer"><button type="button" id="dewa-panel-cancel" class="btn btn-outline-primary">Close</button></div>
  </div>
</div>
<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;"><div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div></div>
</div>
