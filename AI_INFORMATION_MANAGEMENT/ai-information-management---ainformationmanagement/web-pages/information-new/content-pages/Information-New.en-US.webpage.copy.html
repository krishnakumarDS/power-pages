<div class="dewa-app-page" style="max-width:720px;">
  <div class="dewa-page-header">
    <div>
      <h1>Submit New Information</h1>
      <p>Provide details about the AI-related information you want to submit.</p>
    </div>
  </div>

  <div id="dewa-alert-slot"></div>

  <div class="card" style="padding:1.75rem;">
    <div class="mb-3">
      <label class="dewa-field-label">Title</label>
      <input type="text" class="form-control" id="dewa-new-title" placeholder="e.g. AI Model Usage Policy — Customer Chatbot" />
    </div>
    <div class="mb-3">
      <label class="dewa-field-label">Category</label>
      <input type="text" class="form-control" id="dewa-new-category" placeholder="e.g. Policy, Data Governance, Risk Assessment" />
    </div>
    <div class="mb-3">
      <label class="dewa-field-label">Description</label>
      <textarea class="form-control" id="dewa-new-description" rows="6" placeholder="Describe the AI information being submitted, its purpose and scope."></textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
      <a class="btn btn-outline-primary" href="/information">Cancel</a>
      <button type="button" class="btn btn-dewa-primary" id="dewa-new-submit">Submit</button>
    </div>
  </div>
</div>
