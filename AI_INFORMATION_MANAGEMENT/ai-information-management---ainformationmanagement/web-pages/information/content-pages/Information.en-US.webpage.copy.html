<div class="dewa-app-page">
  <div class="dewa-page-header">
    <div>
      <h1>AI Information</h1>
      <p>All submitted AI information records.</p>
    </div>
    <div>
      <a class="btn btn-dewa-primary" href="/information/new">+ Submit New</a>
    </div>
  </div>

  <div class="dewa-table-wrap">
    <table class="dewa-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Status</th>
          <th>Last Updated</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="dewa-info-tbody">
        <tr>
          <td colspan="5" style="text-align:center;padding:2rem;color:var(--dewa-text-secondary);">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="dewa-panel-backdrop" id="dewa-panel-backdrop"></div>
  <div class="dewa-panel" id="dewa-info-panel" style="width:480px;">
    <div class="dewa-panel-header">
      <h3 style="margin:0;">Record Details</h3>
      <button type="button" id="dewa-panel-close" aria-label="Close" style="background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--dewa-text-secondary);">&times;</button>
    </div>
    <div class="dewa-panel-body">
      <div class="mb-3">
        <label class="dewa-field-label">Title</label>
        <div id="dewa-view-title"></div>
      </div>
      <div class="mb-3">
        <label class="dewa-field-label">Category</label>
        <div id="dewa-view-category"></div>
      </div>
      <div class="mb-3">
        <label class="dewa-field-label">Status</label>
        <div id="dewa-view-status"></div>
      </div>
      <div class="mb-3">
        <label class="dewa-field-label">Description</label>
        <div id="dewa-view-description"></div>
      </div>
    </div>
    <div class="dewa-panel-footer">
      <button type="button" class="btn btn-outline-primary" id="dewa-panel-cancel">Close</button>
    </div>
  </div>
</div>
